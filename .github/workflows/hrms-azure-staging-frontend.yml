name: Azure-HRMS-Staging-Frontend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ staging ]
    paths:
    - '**'
    - '.github/workflows/hrms-staging-frontend-AutoDeployTrigger-e050ce6f-c006-4994-adca-9f8cd14959ed.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.HRMSSTAGINGFRONTEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.HRMSSTAGINGFRONTEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.HRMSSTAGINGFRONTEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }} 
          registryUrl: hrmsacr.azurecr.io
          registryUsername: ${{ secrets.HRMSSTAGINGFRONTEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.HRMSSTAGINGFRONTEND_REGISTRY_PASSWORD }}
          containerAppName: hrms-staging-frontend
          resourceGroup: HRMS-AZURE
          imageToBuild: hrmsacr.azurecr.io/hrms-staging-frontend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


